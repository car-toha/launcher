name: Build MobileCraft

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # Версия Zalith Launcher 2, на которой основан MobileCraft
  ZALITH_REF: "2.8.1"

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v5
      - name: Build mod
        working-directory: mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mobilecraft-mod
          path: mod/build/libs/mobilecraft-*.jar

  apk:
    needs: mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: mobilecraft-mod, path: modjar }

      - name: Build modpack (.mrpack)
        run: |
          JAR=$(ls modjar/mobilecraft-*.jar | grep -v sources | head -1)
          python3 tools/make_mrpack.py "$JAR" pack

      - name: Clone Zalith Launcher 2
        run: git clone --depth 1 --recursive --branch "$ZALITH_REF" https://github.com/ZalithLauncher/ZalithLauncher2.git zl

      - name: Apply MobileCraft patch
        run: python3 launcher/zalith/patch.py zl pack

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build APK (arm64)
        working-directory: zl
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp "$(find zl/ZalithLauncher/build/outputs/apk -name '*.apk' | head -1)" out/MobileCraft-arm64.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MobileCraft-apk
          path: out/MobileCraft-arm64.apk
